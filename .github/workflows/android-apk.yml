name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The ubuntu runner already ships the Android SDK; just accept licenses so
      # Gradle can auto-install the SDK platform / build-tools it needs.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build web app + sync to Android
        run: |
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FalconCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FalconCam-apk
          path: FalconCam.apk

      - name: Publish APK to the "latest-apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Falcon Cam APK (pinakabagong build)
          body: |
            I-download ang **FalconCam.apk** sa Android phone mo at i-install.
            Build mula sa `${{ github.ref_name }}` @ `${{ github.sha }}`.
          prerelease: true
          files: FalconCam.apk
